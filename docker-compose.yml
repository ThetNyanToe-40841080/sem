version: '3.8'

services:
  app:
    build: .
    command: ["db:3306"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    build: db/.
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pexample"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

networks:
  app-net:
    driver: bridge